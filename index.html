<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game | 知识问答</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 开始界面 -->
    <div class="quiz-container" id="quizContainer">
        <!-- 开始页 -->
        <div class="screen start-screen" id="startScreen">
            <div class="start-icon">🧠</div>
            <h1>知识问答</h1>
            <p class="subtitle">测试你的综合知识</p>
            <div class="quiz-info">
                <div class="info-item">
                    <span class="info-number" id="totalQuestions">10</span>
                    <span class="info-label">题目数</span>
                </div>
                <div class="info-item">
                    <span class="info-number">⏱️</span>
                    <span class="info-label">无时限</span>
                </div>
            </div>
            <button class="btn btn-start" id="startBtn">开始答题</button>
        </div>

        <!-- 答题页 -->
        <div class="screen quiz-screen" id="quizScreen" style="display:none;">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="quiz-stats">
                    <span class="stat-item">第 <strong id="currentNum">1</strong> / <span id="totalNum">10</span> 题</span>
                    <span class="stat-item score-display">得分: <strong id="currentScore">0</strong></span>
                </div>
            </div>

            <div class="question-area">
                <h2 class="question-text" id="questionText"></h2>
                <div class="options" id="optionsContainer"></div>
            </div>

            <div class="quiz-footer">
                <button class="btn btn-next" id="nextBtn" disabled>下一题</button>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="screen result-screen" id="resultScreen" style="display:none;">
            <div class="result-icon" id="resultIcon">🎉</div>
            <h1>答题完成！</h1>
            <div class="result-score">
                <span class="result-number" id="finalScore">0</span>
                <span class="result-total"> / <span id="finalTotal">10</span></span>
            </div>
            <p class="result-message" id="resultMessage"></p>
            <div class="result-details" id="resultDetails"></div>
            <button class="btn btn-restart" id="restartBtn">再玩一次</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
